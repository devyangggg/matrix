openapi: 3.0.0
info:
  title: Matrix Four-Peer Demo API
  version: 1.0.0
tags: []
paths:
  /v1/health:
    get:
      operationId: PeerApi_health
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/jobs:
    get:
      operationId: PeerApi_listJobs
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobIndex'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/jobs/{job_id}:
    put:
      operationId: PeerApi_storeJob
      description: Persist the signed job before returning a signed storage receipt.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashHex'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedJobReceipt'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '413':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedJob'
    get:
      operationId: PeerApi_getJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashHex'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSnapshot'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/jobs/{job_id}/certificates:
    post:
      operationId: PeerApi_storeCertificate
      description: Persist the entire validated package before acknowledging result storage.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashHex'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedResultReceipt'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '413':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertifiedResult'
  /v1/jobs/{job_id}/execute:
    post:
      operationId: PeerApi_execute
      description: Bodyless, idempotent request; requires an existing validated signed job.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashHex'
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAccepted'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/jobs/{job_id}/results:
    post:
      operationId: PeerApi_announceResult
      description: Verify and merge a signed candidate; certification is derived from evidence.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashHex'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingested'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '413':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultAnnouncement'
components:
  schemas:
    CertifiedResult:
      type: object
      required:
        - signed_job
        - result
        - certificate
      properties:
        signed_job:
          $ref: '#/components/schemas/SignedJob'
        result:
          $ref: '#/components/schemas/MonteCarloResult'
        certificate:
          $ref: '#/components/schemas/ResultCertificate'
      description: Self-contained evidence; hashes, signatures, and configuration must all match.
    DockerImageId:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    ErrorBody:
      type: object
      required:
        - code
        - message
        - retryable
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          maxLength: 256
        retryable:
          type: boolean
    ErrorCode:
      type: string
      enum:
        - INVALID_SCHEMA
        - BAD_HASH
        - BAD_SIGNATURE
        - INVALID_CERTIFICATE
        - UNKNOWN_MEMBER
        - CONFIG_MISMATCH
        - UNKNOWN_JOB
        - UNKNOWN_ARTIFACT
        - JOB_CONFLICT
        - INVARIANT_VIOLATION
        - PAYLOAD_TOO_LARGE
        - PAUSED
        - QUEUE_FULL
        - JOB_LIMIT
        - IMAGE_UNAVAILABLE
        - LOCAL_STORAGE_ERROR
        - INTERNAL_ERROR
    ExecutionAccepted:
      type: object
      required:
        - job_id
        - execution_id
        - local_state
      properties:
        job_id:
          $ref: '#/components/schemas/HashHex'
        execution_id:
          allOf:
            - $ref: '#/components/schemas/NonceHex'
          description: Existing ID is returned on a duplicate active/successful request.
        local_state:
          $ref: '#/components/schemas/LocalExecutionState'
    ExecutionAttestation:
      type: object
      required:
        - domain
        - config_hash
        - job_id
        - result_hash
        - signer_id
      properties:
        domain:
          type: string
          enum:
            - matrix.execution.v1
        config_hash:
          $ref: '#/components/schemas/HashHex'
        job_id:
          $ref: '#/components/schemas/HashHex'
        result_hash:
          $ref: '#/components/schemas/HashHex'
        signer_id:
          $ref: '#/components/schemas/PeerId'
    HashHex:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: See RFC 001 for strict parsing, signing, cross-field rules, and fault assumptions.
    Health:
      type: object
      required:
        - protocol_version
        - peer_id
        - config_hash
        - paused
        - running
        - queued
      properties:
        protocol_version:
          type: number
          enum:
            - 1
        peer_id:
          $ref: '#/components/schemas/PeerId'
        config_hash:
          $ref: '#/components/schemas/HashHex'
        paused:
          type: boolean
        running:
          type: integer
          format: uint32
          minimum: 0
          maximum: 1
        queued:
          type: integer
          format: uint32
          minimum: 0
          maximum: 1
          description: Waiting executions; section 5.5 allows at most one.
      description: Diagnostic values are hints, never execution votes or proof of finality.
    Ingested:
      type: object
      required:
        - stored
      properties:
        stored:
          type: boolean
          enum:
            - true
          description: The record is now stored locally; certification is derived from evidence.
    JobIndex:
      type: object
      required:
        - jobs
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/HashHex'
          maxItems: 32
          description: Known job IDs; the index is a hint, not an authority.
    JobRequest:
      type: object
      required:
        - domain
        - job_id
        - spec
      properties:
        domain:
          type: string
          enum:
            - matrix.job.v1
        job_id:
          $ref: '#/components/schemas/HashHex'
        spec:
          $ref: '#/components/schemas/JobSpec'
    JobSnapshot:
      type: object
      required:
        - signed_job
        - local_state
        - announcements
        - job_receipts
        - result_receipts
      properties:
        signed_job:
          $ref: '#/components/schemas/SignedJob'
        local_state:
          $ref: '#/components/schemas/LocalExecutionState'
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/ResultAnnouncement'
          maxItems: 8
          description: At most two distinct results per each of four signers.
        certified_result:
          $ref: '#/components/schemas/CertifiedResult'
        job_receipts:
          type: array
          items:
            $ref: '#/components/schemas/SignedJobReceipt'
          maxItems: 4
        result_receipts:
          type: array
          items:
            $ref: '#/components/schemas/SignedResultReceipt'
          maxItems: 4
    JobSpec:
      type: object
      required:
        - protocol_version
        - config_hash
        - requester_id
        - nonce
        - template_id
        - parameters
      properties:
        protocol_version:
          type: number
          enum:
            - 1
        config_hash:
          $ref: '#/components/schemas/HashHex'
        requester_id:
          $ref: '#/components/schemas/PeerId'
        nonce:
          $ref: '#/components/schemas/NonceHex'
        template_id:
          type: string
          enum:
            - monte-carlo-v1
        parameters:
          $ref: '#/components/schemas/MonteCarloParameters'
      description: Hash exactly this model's canonical JSON; no defaults or additional properties.
    JobStorageReceipt:
      type: object
      required:
        - domain
        - config_hash
        - job_id
        - signer_id
        - retained_until_unix
      properties:
        domain:
          type: string
          enum:
            - matrix.store-job.v1
        config_hash:
          $ref: '#/components/schemas/HashHex'
        job_id:
          $ref: '#/components/schemas/HashHex'
        signer_id:
          $ref: '#/components/schemas/PeerId'
        retained_until_unix:
          type: integer
          format: uint32
          description: Signed retention deadline in Unix seconds; applies to this record's storage.
    LocalExecutionState:
      type: string
      enum:
        - none
        - queued
        - running
        - succeeded_local
        - aborted_local
        - error_local
    MonteCarloParameters:
      type: object
      required:
        - samples
        - seed
      properties:
        samples:
          type: integer
          format: uint32
          minimum: 100000
          maximum: 10000000
        seed:
          type: integer
          format: uint32
    MonteCarloResult:
      type: object
      required:
        - schema_version
        - samples
        - seed
        - hits
      properties:
        schema_version:
          type: integer
          format: uint8
          minimum: 1
          maximum: 1
          description: Exactly 1 in protocol version 1; must equal the catalogue output_schema_version.
        samples:
          type: integer
          format: uint32
          minimum: 100000
          maximum: 10000000
        seed:
          type: integer
          format: uint32
        hits:
          type: integer
          format: uint32
          minimum: 0
          maximum: 10000000
          description: Must be <= samples. Only independent execution may justify signing it.
      description: Exact integer result; samples and seed must equal the job parameters.
    NetworkConfiguration:
      type: object
      required:
        - protocol_version
        - network_id
        - peers
        - catalogue
      properties:
        protocol_version:
          type: number
          enum:
            - 1
        network_id:
          type: string
          pattern: ^[a-z0-9_-]{1,64}$
        peers:
          type: array
          items:
            $ref: '#/components/schemas/PeerConfiguration'
          minItems: 4
          maxItems: 4
        catalogue:
          $ref: '#/components/schemas/TemplateConfiguration'
      description: config_hash is SHA256 of canonical JSON for exactly this object.
    NonceHex:
      type: string
      pattern: ^[0-9a-f]{32}$
    PeerConfiguration:
      type: object
      required:
        - id
        - public_key_hex
        - vpn_ip
        - api_url
      properties:
        id:
          $ref: '#/components/schemas/PeerId'
        public_key_hex:
          $ref: '#/components/schemas/HashHex'
        vpn_ip:
          type: string
          pattern: ^(?:\d{1,3}\.){3}\d{1,3}$
        api_url:
          type: string
          pattern: ^http://(?:\d{1,3}\.){3}\d{1,3}:8443$
          description: Exactly http on the VPN address and port 8443, with no path or trailing slash.
      description: Trusted deployment input, distributed out of band; never learned from a request.
    PeerId:
      type: string
      enum:
        - node_a
        - node_b
        - node_c
        - node_d
    ResultAnnouncement:
      type: object
      required:
        - result
        - attestation
      properties:
        result:
          $ref: '#/components/schemas/MonteCarloResult'
        attestation:
          $ref: '#/components/schemas/SignedAttestation'
      description: A candidate is not a certificate. Sender may relay an existing attestation.
    ResultCertificate:
      type: object
      required:
        - protocol_version
        - config_hash
        - job_id
        - result_hash
        - attestations
      properties:
        protocol_version:
          type: number
          enum:
            - 1
        config_hash:
          $ref: '#/components/schemas/HashHex'
        job_id:
          $ref: '#/components/schemas/HashHex'
        result_hash:
          $ref: '#/components/schemas/HashHex'
        attestations:
          type: array
          items:
            $ref: '#/components/schemas/SignedAttestation'
          minItems: 2
          maxItems: 2
          description: Exactly two distinct matching signers, in lexicographic signer order.
    ResultStorageReceipt:
      type: object
      required:
        - domain
        - config_hash
        - job_id
        - result_hash
        - signer_id
        - retained_until_unix
      properties:
        domain:
          type: string
          enum:
            - matrix.store-result.v1
        config_hash:
          $ref: '#/components/schemas/HashHex'
        job_id:
          $ref: '#/components/schemas/HashHex'
        result_hash:
          $ref: '#/components/schemas/HashHex'
        signer_id:
          $ref: '#/components/schemas/PeerId'
        retained_until_unix:
          type: integer
          format: uint32
          description: Holder persists signed job, result, and certificate through this deadline.
    SignatureHex:
      type: string
      pattern: ^[0-9a-f]{128}$
    SignedAttestation:
      type: object
      required:
        - payload
        - signature
      properties:
        payload:
          $ref: '#/components/schemas/ExecutionAttestation'
        signature:
          $ref: '#/components/schemas/SignatureHex'
    SignedJob:
      type: object
      required:
        - payload
        - signature
      properties:
        payload:
          $ref: '#/components/schemas/JobRequest'
        signature:
          $ref: '#/components/schemas/SignatureHex'
      description: Signature uses the pinned key of payload.spec.requester_id.
    SignedJobReceipt:
      type: object
      required:
        - payload
        - signature
      properties:
        payload:
          $ref: '#/components/schemas/JobStorageReceipt'
        signature:
          $ref: '#/components/schemas/SignatureHex'
    SignedResultReceipt:
      type: object
      required:
        - payload
        - signature
      properties:
        payload:
          $ref: '#/components/schemas/ResultStorageReceipt'
        signature:
          $ref: '#/components/schemas/SignatureHex'
    TemplateConfiguration:
      type: object
      required:
        - template_id
        - image_id
        - algorithm_id
        - cpu_limit
        - memory_mib
        - pids_limit
        - timeout_seconds
        - output_schema_version
      properties:
        template_id:
          type: string
          enum:
            - monte-carlo-v1
        image_id:
          $ref: '#/components/schemas/DockerImageId'
        algorithm_id:
          type: string
          enum:
            - xorshift32-u16-quartercircle-v1
        cpu_limit:
          type: number
          enum:
            - 1
        memory_mib:
          type: number
          enum:
            - 256
        pids_limit:
          type: number
          enum:
            - 64
        timeout_seconds:
          type: number
          enum:
            - 120
        output_schema_version:
          type: number
          enum:
            - 1
          description: Required `schema_version` of a canonical result.
servers:
  - url: http://10.77.0.1:8443
    description: Illustrative tinc address; replace per peer
    variables: {}
