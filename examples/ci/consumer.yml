# Consumer CI (RFC §7.11): download a release and refuse it unless Matrix certified this exact
# binary for this repo and tag. No access to the builders' LAN is needed: `matrix verify` is
# fully offline.
#
# The consumer pins the network: genesis.json and its hash, as published by the founders after
# the founding ceremony (project README, never the release page alone), are checked into the consumer's own
# repo (reviewed once, like a lockfile). The download location (GitHub Releases) is untrusted.
# Only exit code 0 (REPRODUCED) passes; 1 MISMATCH, 2 INVALID_CERT and 4 error all fail.
# Setup: set repository Actions variable MATRIX_VERIFIER_COMMIT to a reviewed, immutable
# 40-character lowercase Matrix source commit SHA. The job fails if it is missing or malformed.
name: verify-hello

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to fetch and verify
        required: true
        default: v1.2.0

env:
  REPO: https://github.com/<org>/matrix-hello # H3: the publisher's repo

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # brings matrix/genesis.json and matrix/genesis.sha256

      - name: Install reviewed matrix verifier
        env:
          MATRIX_VERIFIER_COMMIT: ${{ vars.MATRIX_VERIFIER_COMMIT }}
        run: |
          [[ "$MATRIX_VERIFIER_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Set MATRIX_VERIFIER_COMMIT to a reviewed Matrix commit SHA" >&2; exit 1; }
          pip install "git+https://github.com/ChaoticNebula5/Matrix@${MATRIX_VERIFIER_COMMIT}"

      - name: Download
        run: |
          base="$REPO/releases/download/${{ inputs.tag }}"
          curl -fsSLO "$base/hello"
          curl -fsSLO "$base/hello.matrix.json"

      - name: Verify (fail closed)
        run: |
          matrix --genesis matrix/genesis.json verify hello --cert hello.matrix.json \
            --repo "$REPO" --tag "${{ inputs.tag }}" \
            --genesis-sha256 "$(cat matrix/genesis.sha256)"

      - name: Use the binary
        run: chmod +x hello && ./hello
