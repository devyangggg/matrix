# Publisher CI (RFC §7.11): on a tag push, get the release certified by the Matrix network and
# upload the binary and its certificate. Copy to .github/workflows/ in the Go project's repo.
#
# The runner must be on the same LAN as the builders, so this is a self-hosted runner. Rev 5
# release signers are created by the founding ceremony (`matrix up`): each founding laptop gets
# `<name>-rel` with its key in ~/.matrix/keys/release.key, and a dedicated CI signer cannot be
# added without re-founding. So run this runner on one of the founding laptops, as the user who
# ran `matrix up`, with that node running: it uses ~/.matrix/genesis.json and the laptop's own
# release key in place (private keys never leave the laptop, so never put one in a secret).
# Only exit code 0 means CERTIFIED; anything else fails the job, and nothing is uploaded (fail
# closed).
#
# Setup:
#   ~/.matrix/genesis.json, ~/.matrix/keys/release.key  on the runner, from the ceremony
#   `matrix up` running on the runner's laptop (release finds the builders via 127.0.0.1:7700)
#   vars.MATRIX_VERIFIER_COMMIT  reviewed, immutable 40-character lowercase Matrix source
#                                commit SHA (required; installation fails without it)
name: matrix-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release upload

jobs:
  release:
    runs-on: [self-hosted, matrix-founder]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install reviewed matrix verifier
        env:
          MATRIX_VERIFIER_COMMIT: ${{ vars.MATRIX_VERIFIER_COMMIT }}
        run: |
          [[ "$MATRIX_VERIFIER_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Set MATRIX_VERIFIER_COMMIT to a reviewed Matrix commit SHA" >&2; exit 1; }
          pip install "git+https://github.com/ChaoticNebula5/Matrix@${MATRIX_VERIFIER_COMMIT}"

      - name: Certify
        run: |
          matrix release \
            --repo "https://github.com/${GITHUB_REPOSITORY}" \
            --tag "$GITHUB_REF_NAME" --commit "$(git rev-parse HEAD)" \
            --key "$HOME/.matrix/keys/release.key" --wait 600 --out dist/ --output hello

      - name: Upload binary and certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes "Certified by Matrix" || true
          gh release upload "$GITHUB_REF_NAME" dist/hello dist/hello.matrix.json --clobber
