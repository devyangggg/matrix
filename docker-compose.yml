# Single-machine Matrix network: 8 builders on 4 simulated operators (laptopA..D).
# Linux or WSL2 only. Setup: docs/LLD.md §12 and AGENTS.md "Run it".
#
#   cp .env.example .env            # then edit it
#   python scripts/dev_genesis.py --out dev --addrs compose --profile demo \
#       --repo https://github.com/<org>/<repo> --image golang@sha256:<amd64 digest>
#   docker compose up -d --build
#   docker compose run --rm cli release --repo ... --tag ... --commit ... --key /etc/matrix/keys/release.key
#   docker compose run --rm cli tui
name: matrix

x-builder: &builder
  build: .
  image: matrix:dev
  restart: unless-stopped
  user: "${MATRIX_UID:-1000}:${MATRIX_GID:-1000}"
  group_add:
    - "${DOCKER_GID:?set DOCKER_GID in .env}"
  volumes:
    # Build containers run on the host daemon, so data must have the same path inside and out.
    - /var/run/docker.sock:/var/run/docker.sock
    - ${MATRIX_DATA:?set MATRIX_DATA in .env}:${MATRIX_DATA}
    - ./dev/genesis.json:/etc/matrix/genesis.json:ro
    - ./dev/keys:/etc/matrix/keys:ro
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7700/v1/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 3

services:
  # laptopA
  builder1:
    <<: *builder
    command: [matrix-node, --genesis, /etc/matrix/genesis.json, --id, builder1, --key, /etc/matrix/keys/builder1.key, --listen, "0.0.0.0:7700", --data, "${MATRIX_DATA}/builder1"]
    ports: ["127.0.0.1:7700:7700"]
  builder2:
    <<: *builder
    command: [matrix-node, --genesis, /etc/matrix/genesis.json, --id, builder2, --key, /etc/matrix/keys/builder2.key, --listen, "0.0.0.0:7700", --data, "${MATRIX_DATA}/builder2"]
    ports: ["127.0.0.1:7701:7700"]
  # laptopB
  builder3:
    <<: *builder
    command: [matrix-node, --genesis, /etc/matrix/genesis.json, --id, builder3, --key, /etc/matrix/keys/builder3.key, --listen, "0.0.0.0:7700", --data, "${MATRIX_DATA}/builder3"]
    ports: ["127.0.0.1:7702:7700"]
  builder4:
    <<: *builder
    command: [matrix-node, --genesis, /etc/matrix/genesis.json, --id, builder4, --key, /etc/matrix/keys/builder4.key, --listen, "0.0.0.0:7700", --data, "${MATRIX_DATA}/builder4"]
    ports: ["127.0.0.1:7703:7700"]
  # laptopC
  builder5:
    <<: *builder
    command: [matrix-node, --genesis, /etc/matrix/genesis.json, --id, builder5, --key, /etc/matrix/keys/builder5.key, --listen, "0.0.0.0:7700", --data, "${MATRIX_DATA}/builder5"]
    ports: ["127.0.0.1:7704:7700"]
  builder6:
    <<: *builder
    command: [matrix-node, --genesis, /etc/matrix/genesis.json, --id, builder6, --key, /etc/matrix/keys/builder6.key, --listen, "0.0.0.0:7700", --data, "${MATRIX_DATA}/builder6"]
    ports: ["127.0.0.1:7705:7700"]
  # laptopD
  builder7:
    <<: *builder
    command: [matrix-node, --genesis, /etc/matrix/genesis.json, --id, builder7, --key, /etc/matrix/keys/builder7.key, --listen, "0.0.0.0:7700", --data, "${MATRIX_DATA}/builder7"]
    ports: ["127.0.0.1:7706:7700"]
  builder8:
    <<: *builder
    command: [matrix-node, --genesis, /etc/matrix/genesis.json, --id, builder8, --key, /etc/matrix/keys/builder8.key, --listen, "0.0.0.0:7700", --data, "${MATRIX_DATA}/builder8"]
    ports: ["127.0.0.1:7707:7700"]

  # One-off CLI / TUI inside the compose network (builderN:7700 resolves here, not on the host).
  cli:
    image: matrix:dev
    profiles: [tools]
    user: "${MATRIX_UID:-1000}:${MATRIX_GID:-1000}"
    entrypoint: [matrix]
    working_dir: /work
    environment:
      MATRIX_GENESIS: /etc/matrix/genesis.json
    volumes:
      - ./dev/genesis.json:/etc/matrix/genesis.json:ro
      - ./dev/keys/release.key:/etc/matrix/keys/release.key:ro
      - ./dist:/work/dist
    stdin_open: true
    tty: true
