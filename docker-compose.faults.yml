# Demo faults for the single-machine network (RFC §7.14, rev 5 §9.2), same laptops as the demo.
# Always name the ONE builder to restart (f = 1: never two faulty builders at once):
#
#   docker compose -f docker-compose.yml -f docker-compose.faults.yml up -d builder3   # scene 3
#   docker compose -f docker-compose.yml -f docker-compose.faults.yml up -d builder2   # scene 7
#
# Reset to honest: docker compose up -d builder3   (or builder2)
services:
  # Scene 3 (SolarWinds): laptopC applies a backdoor patch before building.
  builder3:
    command: [matrix-node, --genesis, /etc/matrix/genesis.json, --id, builder3, --key, /etc/matrix/keys/builder3.key, --listen, "0.0.0.0:7700", --data, "${MATRIX_DATA}/builder3",
              --allow-faults, --fault, inject, --patch, /etc/matrix/faults/backdoor.patch]
    volumes:
      - ./examples/faults:/etc/matrix/faults:ro

  # Scene 7 (caught cheater): laptopB signs two different results for one request.
  builder2:
    command: [matrix-node, --genesis, /etc/matrix/genesis.json, --id, builder2, --key, /etc/matrix/keys/builder2.key, --listen, "0.0.0.0:7700", --data, "${MATRIX_DATA}/builder2",
              --allow-faults, --fault, equivocate]

  # Other modes for experiments, one builder at a time (edit a command above):
  #   --fault lie (random dishonest vote), stall (no vote), bad-artifact (valid vote, corrupted
  #   download), crash (also set restart: "no", or compose restarts it in a loop)
