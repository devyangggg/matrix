# Network parameters for `matrix up` (RFC rev 5 §7.16, LLD §4.2). Every founding laptop must use
# the same checkout of this file: founders with a different file are flagged and the seal is refused.
#
# Fill in the two placeholders before the ceremony (AGENTS §4: H3 repo URL, H4 linux/amd64 digest
# from `docker buildx imagetools inspect golang:1.23`). Until then the seal is refused on purpose
# ("invalid genesis"), so a network can never be founded with a made-up digest.
[network]
name = "matrix-demo"
allowed_repos = ["https://github.com/<org>/matrix-hello"]
allowed_images = { "go1.23" = "golang@sha256:<linux/amd64 digest>" }
allowed_goos = ["linux"]
allowed_goarch = ["amd64"]
build_timeout_s = 45
request_ttl_s = 3600
sync_interval_s = 5
